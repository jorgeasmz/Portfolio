# Dependency drift is what blocked this deployment: next-mdx-remote 5.0.0 sat
# in the lockfile until Vercel refused to ship it. Weekly updates surface that
# as a pull request the CI can vet, instead of as a failed release.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps; anything major still arrives on its own.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
