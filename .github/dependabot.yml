# Surfaces dependency drift as a pull request the CI can vet, not as a failed deploy.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps; majors still arrive on their own.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # eslint-config-next bundles a plugin that has not adopted the ESLint 10 rule API.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
